<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGD Solutions - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
        }

        /* Login Form */
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            margin: 0 auto;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #b8860b;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            color: white;
            padding: 24px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 24px;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255,255,255,0.3);
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .stat-card .stat-value {
            color: #2c3e50;
            font-size: 32px;
            font-weight: bold;
        }

        .filters {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-group label {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .contacts-table {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #2c3e50;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-contacted { background: #fff3e0; color: #f57c00; }
        .status-qualified { background: #e8f5e9; color: #388e3c; }
        .status-closed { background: #f3e5f5; color: #7b1fa2; }

        .btn-view {
            background: #b8860b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-view:hover {
            background: #8b6914;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #2c3e50;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .contact-detail {
            margin-bottom: 20px;
        }

        .contact-detail label {
            display: block;
            color: #7f8c8d;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .contact-detail .value {
            color: #2c3e50;
            font-size: 16px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .status-update {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .status-update select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .btn-update {
            width: 100%;
            padding: 12px;
            background: #b8860b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-update:hover {
            background: #8b6914;
        }

        /* Custom Notification */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            animation: slideIn 0.3s ease;
            min-width: 300px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .notification.success {
            border-left: 4px solid #4caf50;
        }

        .notification.error {
            border-left: 4px solid #f44336;
        }

        .notification .icon {
            font-size: 24px;
        }

        .notification.success .icon {
            color: #4caf50;
        }

        .notification.error .icon {
            color: #f44336;
        }

        .notification .message {
            flex: 1;
            color: #2c3e50;
            font-weight: 500;
        }

        .notification .close-notification {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #7f8c8d;
            padding: 0;
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <!-- Custom Notification -->
    <div class="notification" id="notification">
        <div class="icon"></div>
        <div class="message"></div>
        <button class="close-notification" onclick="closeNotification()">&times;</button>
    </div>

    <div class="container">
        <!-- Login Form -->
        <div class="login-card" id="loginForm">
            <div class="login-header">
                <h1><i class="fas fa-lock"></i> Admin Login</h1>
                <p>AGD Solutions Dashboard</p>
            </div>
            <div class="error-message" id="loginError"></div>
            <form id="loginFormElement">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="dashboard" id="dashboard">
            <div class="dashboard-header">
                <h1><i class="fas fa-chart-line"></i> Contact Dashboard</h1>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Total Contacts</h3>
                    <div class="stat-value" id="totalContacts">0</div>
                </div>
                <div class="stat-card">
                    <h3>New</h3>
                    <div class="stat-value" id="newContacts">0</div>
                </div>
                <div class="stat-card">
                    <h3>Contacted</h3>
                    <div class="stat-value" id="contactedContacts">0</div>
                </div>
                <div class="stat-card">
                    <h3>Qualified</h3>
                    <div class="stat-value" id="qualifiedContacts">0</div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Filter by Status:</label>
                    <select id="statusFilter" onchange="loadContacts()">
                        <option value="">All Status</option>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="qualified">Qualified</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
                <button class="btn-view" onclick="loadContacts()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
            </div>

            <div class="contacts-table">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Interest</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr>
                            <td colspan="7" class="loading">Loading contacts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Contact Detail Modal -->
    <div class="modal" id="contactModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Contact Details</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="contactDetails"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let currentContacts = [];
        let authToken = localStorage.getItem('adminToken');

        // Check if already logged in
        if (authToken) {
            showDashboard();
        }

        // Login
        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    authToken = data.token;
                    localStorage.setItem('adminToken', authToken);
                    showDashboard();
                } else {
                    showError(data.message || 'Invalid credentials');
                }
            } catch (error) {
                showError('Connection error. Please ensure the backend is running.');
                console.error('Login error:', error);
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showDashboard() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadContacts();
            loadStats();
        }

        function logout() {
            localStorage.removeItem('adminToken');
            authToken = null;
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/contacts`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();

                if (data.success) {
                    const contacts = data.contacts;
                    document.getElementById('totalContacts').textContent = contacts.length;
                    document.getElementById('newContacts').textContent = 
                        contacts.filter(c => c.status === 'new').length;
                    document.getElementById('contactedContacts').textContent = 
                        contacts.filter(c => c.status === 'contacted').length;
                    document.getElementById('qualifiedContacts').textContent = 
                        contacts.filter(c => c.status === 'qualified').length;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadContacts() {
            const status = document.getElementById('statusFilter').value;
            const url = status ? `${API_URL}/contacts?status=${status}` : `${API_URL}/contacts`;

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();

                if (data.success) {
                    currentContacts = data.contacts;
                    renderContacts(currentContacts);
                    loadStats();
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
            }
        }

        function renderContacts(contacts) {
            const tbody = document.getElementById('contactsTableBody');
            
            if (contacts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="loading">No contacts found</td></tr>';
                return;
            }

            tbody.innerHTML = contacts.map(contact => `
                <tr>
                    <td>${new Date(contact.submittedAt).toLocaleDateString()}</td>
                    <td>${contact.name}</td>
                    <td>${contact.email}</td>
                    <td>${contact.phone || '-'}</td>
                    <td>${contact.interest}</td>
                    <td><span class="status-badge status-${contact.status}">${contact.status}</span></td>
                    <td>
                        <button class="btn-view" onclick="viewContact('${contact._id}')">
                            <i class="fas fa-eye"></i> View
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function viewContact(id) {
            const contact = currentContacts.find(c => c._id === id);
            if (!contact) return;

            const details = `
                <div class="contact-detail">
                    <label>Name</label>
                    <div class="value">${contact.name}</div>
                </div>
                <div class="contact-detail">
                    <label>Email</label>
                    <div class="value">${contact.email}</div>
                </div>
                <div class="contact-detail">
                    <label>Phone</label>
                    <div class="value">${contact.phone || 'Not provided'}</div>
                </div>
                <div class="contact-detail">
                    <label>Practice Name</label>
                    <div class="value">${contact.practice || 'Not provided'}</div>
                </div>
                <div class="contact-detail">
                    <label>Specialty</label>
                    <div class="value">${contact.specialty || 'Not provided'}</div>
                </div>
                <div class="contact-detail">
                    <label>Area of Interest</label>
                    <div class="value">${contact.interest}</div>
                </div>
                <div class="contact-detail">
                    <label>Message</label>
                    <div class="value">${contact.message || 'No message'}</div>
                </div>
                <div class="contact-detail">
                    <label>Submitted At</label>
                    <div class="value">${new Date(contact.submittedAt).toLocaleString()}</div>
                </div>
                <div class="status-update">
                    <label>Update Status</label>
                    <select id="newStatus">
                        <option value="new" ${contact.status === 'new' ? 'selected' : ''}>New</option>
                        <option value="contacted" ${contact.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                        <option value="qualified" ${contact.status === 'qualified' ? 'selected' : ''}>Qualified</option>
                        <option value="closed" ${contact.status === 'closed' ? 'selected' : ''}>Closed</option>
                    </select>
                    <button class="btn-update" onclick="updateStatus('${contact._id}')">
                        <i class="fas fa-save"></i> Update Status
                    </button>
                </div>
            `;

            document.getElementById('contactDetails').innerHTML = details;
            document.getElementById('contactModal').style.display = 'flex';
        }

        async function updateStatus(id) {
            const newStatus = document.getElementById('newStatus').value;

            try {
                const response = await fetch(`${API_URL}/contacts/${id}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await response.json();

                if (data.success) {
                    closeModal();
                    loadContacts();
                    showNotification('Status updated successfully!', 'success');
                } else {
                    showNotification(data.message || 'Error updating status', 'error');
                }
            } catch (error) {
                showNotification('Error updating status. Please try again.', 'error');
            }
        }

        function closeModal() {
            document.getElementById('contactModal').style.display = 'none';
        }

        // Custom notification system
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            const icon = notification.querySelector('.icon');
            const messageEl = notification.querySelector('.message');
            
            // Set message
            messageEl.textContent = message;
            
            // Set icon and type
            notification.className = `notification ${type}`;
            if (type === 'success') {
                icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            } else if (type === 'error') {
                icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
            }
            
            // Show notification
            notification.style.display = 'flex';
            
            // Auto hide after 4 seconds
            setTimeout(() => {
                closeNotification();
            }, 4000);
        }

        function closeNotification() {
            const notification = document.getElementById('notification');
            notification.style.display = 'none';
        }
    </script>
</body>
</html>
